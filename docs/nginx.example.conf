# Example host Nginx reverse proxy for the unified CodeBuddy2Api container.
#
# Optional: the default Compose mapping is loopback-only and needs no proxy. Use
# this when the console and API must be reachable on a public HTTPS domain.
#
# Copy to /etc/nginx/conf.d/codebuddy2api.conf (that include sits in the http
# context, so log_format below is valid), replace codebuddy.example.com and the
# certificate paths, then `nginx -t && systemctl reload nginx`.
#
# The container keeps listening on 0.0.0.0:8787; keep the Compose mapping on
# 127.0.0.1 and let this proxy be the only public entry point.

# Never log the query string. The sign-in callback carries one-time codes and
# state tokens, so this format records only the method and path.
log_format codebuddy_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name codebuddy.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name codebuddy.example.com;

    ssl_certificate     /etc/letsencrypt/live/codebuddy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codebuddy.example.com/privkey.pem;

    # Matches the container's default CODEBUDDY2API_MAX_INBOUND_BYTES (64 MiB);
    # raise both together if you accept larger requests.
    client_max_body_size 64m;

    access_log /var/log/nginx/codebuddy2api.access.log codebuddy_safe;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # PUBLIC_ORIGIN must be the origin browsers see, so forward the real host
        # and scheme instead of the proxy's.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Inference replies stream (SSE): buffering or compression delays first chunks.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;

        # Keep JSON error details instead of replacing them with an Nginx HTML page.
        proxy_intercept_errors off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}