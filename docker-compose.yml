# Pull-only deployment of the unified CodeBuddy2Api application (backend + console).
#
# Requires Docker Compose v2 (`docker compose`). The `version:` key is obsolete and
# the optional updater uses profiles, so Compose v1 / `docker-compose` is not supported.
#
# Quick start:
#   cp .env.example .env        # set the fork image, the OIDC client and the data directory
#   docker compose pull
#   docker compose up -d --no-build
#
# Local source build (same application, never selected by the updater):
#   docker compose -f docker-compose.yml -f docker-compose.build.yaml up -d --build
#
# Automatic image updates (opt-in; only this application, never itself):
#   docker compose --profile auto-update up -d
#
# Registry login, upgrade, rollback and schema-safe downgrade: docs/deployment.md.

services:
  codebuddy2api:
    # Published fork image. Never the upstream author's repository: point this at
    # this fork's GHCR path, its CNB mirror, or any registry you can pull from.
    image: ${CODEBUDDY2API_IMAGE:-ghcr.io/azurekiln2333/codebuddy2api:latest}
    container_name: codebuddy2api
    # Reap orphaned children instead of leaving PID 1 in charge.
    init: true
    ports:
      - "${CODEBUDDY2API_BIND:-127.0.0.1}:${CODEBUDDY2API_PORT:-8787}:8787"
    volumes:
      # Persist credentials, SQLite databases and WAL/SHM files in one writable local directory.
      - "${CODEBUDDY2API_AUTH_PATH:-./auth}:/data/auth"
    environment:
      # Console login is the Compose default. Startup fails closed when the OIDC
      # settings below are incomplete; there is no API-key fallback in SSO mode.
      # Set CODEBUDDY2API_SSO_ENABLED=false only for legacy local API operation.
      CODEBUDDY2API_SSO_ENABLED: ${CODEBUDDY2API_SSO_ENABLED:-true}
      # Public HTTPS origin browsers use (OIDC redirect base and Origin allowlist).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Confidential OIDC client. The browser never receives these values.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REFRESH: ${OIDC_REFRESH:-false}
      # Loopback-only development escape hatch for plain-HTTP origins. Never true in production.
      ALLOW_INSECURE_LOCALHOST: ${ALLOW_INSECURE_LOCALHOST:-false}
      # Optional session tuning; an empty value keeps the built-in default.
      SESSION_TTL_MS: ${SESSION_TTL_MS:-}
      SESSION_IDLE_MS: ${SESSION_IDLE_MS:-}
      TRANSACTION_TTL_MS: ${TRANSACTION_TTL_MS:-}
      MAX_SESSIONS: ${MAX_SESSIONS:-}
      OAUTH_TIMEOUT_MS: ${OAUTH_TIMEOUT_MS:-}
      # Server api_key for inference clients and backend automation only. The
      # console never reads it: browsers authenticate through the OIDC session.
      CODEBUDDY2API_KEY: ${CODEBUDDY2API_KEY:-}
      CODEBUDDY2API_ADMIN_CSRF: ${CODEBUDDY2API_ADMIN_CSRF:-true}
      # Daily guards key on a local calendar day, so the container should share the
      # operator's zone; a UTC container turns those guards over at 08:00 Beijing.
      TZ: ${TZ:-UTC}
      # First-Buddy onboarding may send one bounded real WorkBuddy conversation per account.
      CODEBUDDY2API_AUTO_ACCEPT_BUDDY: ${CODEBUDDY2API_AUTO_ACCEPT_BUDDY:-false}
      # Unset variables remain configurable through the WebUI.
      CODEBUDDY2API_ADMIN_ORIGINS:
      # Trusted proxy IPs/CIDRs; forwarded headers count only from these peers.
      CODEBUDDY2API_TRUSTED_PROXIES:
      CODEBUDDY2API_KEEP_TOOL_METADATA:
      CODEBUDDY2API_MAX_IMAGES: ${CODEBUDDY2API_MAX_IMAGES:-16}
      CODEBUDDY2API_IMAGE_POLICY: ${CODEBUDDY2API_IMAGE_POLICY:-truncate}
      CODEBUDDY2API_MAX_REQUEST_BYTES: ${CODEBUDDY2API_MAX_REQUEST_BYTES:-33554432}
      CODEBUDDY2API_LOG_BODY_LIMIT: ${CODEBUDDY2API_LOG_BODY_LIMIT:-65536}
      CODEBUDDY2API_LOG: ${CODEBUDDY2API_LOG:-}
      CODEBUDDY2API_MAX_INBOUND_BYTES: ${CODEBUDDY2API_MAX_INBOUND_BYTES:-67108864}
      CODEBUDDY2API_MAX_COLLECT_BYTES: ${CODEBUDDY2API_MAX_COLLECT_BYTES:-8388608}
      CODEBUDDY2API_MAX_CONCURRENT: ${CODEBUDDY2API_MAX_CONCURRENT:-64}
      CODEBUDDY2API_UPSTREAM_KEEPALIVE:
      CODEBUDDY2API_MAX_INFLIGHT_PER_ACCOUNT:
      CODEBUDDY2API_REQUEST_CONTEXT_MODE:
      CODEBUDDY2API_RESPONSES_PROJECTION_MODE:
      CODEBUDDY2API_RESPONSES_PROJECTION_MAX_BYTES:
      CODEBUDDY2API_STREAM_MODE:
      CODEBUDDY2API_MODEL_CAPABILITY_GUARD:
      CODEBUDDY2API_TOOL_CALL_MAX_RETRY: ${CODEBUDDY2API_TOOL_CALL_MAX_RETRY:-3}
      CODEBUDDY2API_FAILOVER_MAX:
      CODEBUDDY2API_RETRY_WRITE_TIMEOUT:
      CODEBUDDY_IMPORT_DIR: ${CODEBUDDY_IMPORT_DIR:-/data/auth/imports}
      # Bind container interfaces; host port mapping controls external access.
      CODEBUDDY2API_ALLOW_OPEN_NOAUTH: "true"
      CODEBUDDY_AUTH_DIR: /data/auth
    command: >
      python3 converter.py
      --host 0.0.0.0
      --port 8787
      --skip-check
      --desensitize
    restart: unless-stopped
    # The updater selects containers by label, not by name: this service opts in,
    # the updater itself opts out, and both share one per-deployment scope.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-codebuddy2api}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional image updater. Inactive unless the auto-update profile is requested,
  # so a default `docker compose up -d` never pulls or restarts anything on its own.
  # Maintained fork of the archived containrrr/watchtower; labels keep the original
  # com.centurylinklabs.watchtower.* namespace. Pinned by version, never `latest`.
  watchtower:
    profiles: [auto-update]
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      # Only containers carrying watchtower.enable=true are candidates.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Same scope as the application: this deployment alone, not other projects.
      WATCHTOWER_SCOPE: "${COMPOSE_PROJECT_NAME:-codebuddy2api}"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      # Root-equivalent access to the Docker host. Never publish or reuse this service elsewhere.
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      # The updater must never update itself.
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: "${COMPOSE_PROJECT_NAME:-codebuddy2api}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"