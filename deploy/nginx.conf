# Sample Nginx site for the gateway topology (CONTAINER deployment).
#
#   Internet -> Nginx (TLS) -> gateway 8788 -> private FastAPI 8787
#
# In compose, Nginx and the gateway share the `edge` network, so the upstream
# MUST be addressed by the gateway SERVICE NAME on port 8788. `127.0.0.1:8788`
# is wrong inside the Nginx container (it would only reach Nginx itself).
# The gateway listener is only reachable from Nginx; the upstream admin port is
# never exposed here. SSE endpoints must disable buffering and response
# compression to preserve streaming semantics.

# This file is included by nginx.conf inside http {}; log_format is valid only
# at that level. Omit query strings and Referer, which can contain OAuth codes.
log_format gateway_safe '$remote_addr - [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';

upstream gateway_upstream {
    server gateway:8788;
    keepalive 32;
}

server {
    listen 80;
    server_name gateway.example.com;
    access_log /var/log/nginx/access.log gateway_safe;
    # Redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Never advertise internal components.
    server_tokens off;

    client_max_body_size 64m;

    # Fix 8: never write the request line / query string to the access log.
    # `/sso/callback?code=...&state=...` would leak one-time authorization
    # codes and state into logs. Log the path only, with no arguments.
    # (Disable entirely with `access_log off;` if even paths are sensitive.)
    access_log /var/log/nginx/access.log gateway_safe;

    # Security headers. The gateway sets its own cookie attributes; these apply
    # to HTML/asset responses served through the dashboard.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Do NOT synthesize X-Forwarded-*/X-Real-IP: the gateway strips these
        # anyway, and forwarding them would let a spoofed value reach a
        # misconfigured hop. Keep the browser Origin for gateway CSRF checks.
        proxy_set_header Connection        "";

        proxy_pass_request_headers on;

        proxy_read_timeout    660s;
        proxy_send_timeout    660s;
        proxy_connect_timeout 10s;

        # Streaming (SSE) support: no buffering, no gzip, no response buffering.
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
    }

    # Health probe without auth noise.
    location = /healthz {
        proxy_pass http://gateway_upstream/healthz;
        access_log off;
    }
}
