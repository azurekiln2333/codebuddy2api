# Gateway deployment example for a NATIVE (non-container) Nginx host.
#
#   Internet -> Nginx (TLS, public 443) -> gateway 127.0.0.1:8788 -> FastAPI 127.0.0.1:8787
#
# Here Nginx runs on the same host as the gateway, so the upstream IS loopback:
# 127.0.0.1:8788. (The container example targets the compose service name
# `gateway:8788` instead — do not mix the two.)

# Include this file inside nginx.conf's http {} block. log_format is valid
# only at that level; omit both query strings and query-bearing Referer.
log_format gateway_safe '$remote_addr - [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';

upstream gateway_upstream {
    server 127.0.0.1:8788;
    keepalive 32;
}

server {
    listen 80;
    server_name gateway.example.com;
    access_log /var/log/nginx/access.log gateway_safe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64m;

    # Fix 8: never log the query string. `/sso/callback?code=...&state=...`
    # would otherwise persist one-time authorization codes and state tokens.
    # Log the path only, with no arguments.
    access_log /var/log/nginx/access.log gateway_safe;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Do not synthesize X-Forwarded-*/X-Real-IP; the gateway strips them.
        proxy_set_header Connection        "";

        # SSE / streaming: disable buffering and compression end to end.
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_set_header X-Accel-Buffering no;

        proxy_read_timeout    660s;
        proxy_send_timeout    660s;
        proxy_connect_timeout 10s;
    }

    location = /healthz {
        proxy_pass http://gateway_upstream/healthz;
        access_log off;
    }
}
