name: Build, package and release

# One pipeline validates the whole application, packages the release archive and
# only then publishes. Version, image tag and package contracts live in
# `scripts/` so this workflow and `.cnb.yml` cannot drift apart.
#
# * pull_request: validate + build, never log in or publish
# * push main:    validate + package + publish `edge`
# * push v*:      validate + package, publish the versioned images, and only
#                 then create the Release. A tag whose image failed is never
#                 recorded as a successful release.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'examples/**', 'LICENSE']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'examples/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight tag release; PR runs may supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Validate authoritative version
        id: version
        run: python scripts/check_version.py --check-pyproject --check-compose
      - name: Install test dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: Run backend regression tests
        run: python scripts/run_backend_tests.py

  web:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      RAYON_NUM_THREADS: '2'
      WEBUI_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install pinned vp
        run: |
          curl -fsSL https://github.com/voidzero-dev/vite-plus/releases/download/v0.3.1/vp-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/vp.tar.gz"
          echo "a3a728816a5937fbfd06d9987c8d8a1152c6a90de22a827b840079140021d030  $RUNNER_TEMP/vp.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/vp"
          tar -xzf "$RUNNER_TEMP/vp.tar.gz" -C "$RUNNER_TEMP/vp"
          echo "$RUNNER_TEMP/vp" >> "$GITHUB_PATH"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/codebuddy-browser" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vp/vp" env off
      - name: Install backend fixture dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'
      - name: Check and build WebUI
        working-directory: web
        run: |
          vp install --frozen-lockfile
          vp check
          vp test run
          vp build
      - name: Browser regression tests
        working-directory: web
        run: |
          vp exec playwright install --with-deps chromium-headless-shell
          vp exec playwright test
          # Native SSO suite: self-starting and a required CI gate, so it runs
          # unconditionally. The external integration suite needs
          # AZUREKILN_INTEGRATION_URL, so it stays a manual suite only.
          vp exec playwright test -c playwright.native.config.ts
      - name: Upload tested WebUI build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  package:
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download tested WebUI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist
      - name: Build release archive
        id: package
        run: python scripts/package.py
      - name: Verify release archive
        run: python scripts/package.py --verify "dist/${{ steps.package.outputs.archive }}"
      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-archive
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
            dist/build-manifest.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    # PRs and branch pushes never publish a GitHub release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Ordered gate: the Release is written only after the images are pushed, so a
    # failed image build cannot leave a Release that claims a published version.
    # The image guard excludes PRs only, so version tags always reach this gate.
    needs: [test, package, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-archive
          path: dist
      - name: Publish release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.test.outputs.prerelease }}
          RELEASE_ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "${RELEASE_ARCHIVE}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "${RELEASE_ARCHIVE}.sha256" SHA256SUMS --clobber
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release edit "$RELEASE_TAG" --notes-file release-notes.md --prerelease
            else
              gh release edit "$RELEASE_TAG" --notes-file release-notes.md --latest
            fi
          else
            flags=()
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" "${RELEASE_ARCHIVE}.sha256" SHA256SUMS \
              --verify-tag --title "codebuddy2api v$RELEASE_VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi

  image:
    # PRs validate and package; main and tag pushes also publish the tested image.
    if: github.event_name != 'pull_request'
    needs: [test, web, package]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested WebUI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve publication tags
        id: release
        run: python scripts/release_tags.py --platform github --emit github
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to the registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.release.outputs.registry }}
          username: ${{ steps.release.outputs.registry_user || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-contexts: webui=web/dist
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.release.outputs.refs }}
          labels: |
            org.opencontainers.image.version=${{ needs.test.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BUILD_CHANNEL=${{ startsWith(github.ref, 'refs/tags/v') && needs.test.outputs.prerelease == 'false' && 'stable' || 'edge' }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
